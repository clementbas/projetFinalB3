openapi: 3.0.3
info:
  title: API de Gestion de Salons
  version: 1.0.0
  description: API pour la gestion des utilisateurs, salons et rendez-vous.

servers:
  - url: http://localhost:3000/api

tags:
  - name: Auth
  - name: Users
  - name: Rendezvous
  - name: Salons

paths:

  /auth/register:
    post:
      tags: [Auth]
      summary: Inscription utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Utilisateur inscrit

  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Connexion réussie

  /auth/me:
    get:
      tags: [Auth]
      summary: Informations de l'utilisateur connecté
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Données de l'utilisateur

  /users/list:
    get:
      tags: [Users]
      summary: Liste des utilisateurs (ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des utilisateurs

  /users/{id}/role:
    put:
      tags: [Users]
      summary: Modifier le rôle d'un utilisateur (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
      responses:
        '200':
          description: Rôle mis à jour

  /users/{id}:
    get:
      tags: [Users]
      summary: Informations d’un utilisateur (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails utilisateur

    put:
      tags: [Users]
      summary: Modifier un utilisateur (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Utilisateur mis à jour

    delete:
      tags: [Users]
      summary: Supprimer un utilisateur (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Utilisateur supprimé

  /users/rdv:
    get:
      tags: [Users]
      summary: Tous les rendez-vous avec infos clients/salons (ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des rendez-vous

  /rendezvous/{salonId}:
    post:
      tags: [Rendezvous]
      summary: Réserver un rendez-vous
      security:
        - bearerAuth: []
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Rendez-vous créé

  /rendezvous/salon/{salonId}:
    get:
      tags: [Rendezvous]
      summary: Voir les rendez-vous d’un salon (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Liste des rendez-vous du salon

  /rendezvous/mes:
    get:
      tags: [Rendezvous]
      summary: Voir ses rendez-vous
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rendez-vous de l'utilisateur

  /rendezvous/{id}:
    delete:
      tags: [Rendezvous]
      summary: Annuler un rendez-vous (ADMIN/Propriétaire/Client)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Rendez-vous annulé

  /salons:
    post:
      tags: [Salons]
      summary: Créer un salon (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Salon créé

    get:
      tags: [Salons]
      summary: Voir tous les salons
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des salons

  /salons/{id}:
    put:
      tags: [Salons]
      summary: Modifier un salon (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Salon mis à jour

    delete:
      tags: [Salons]
      summary: Supprimer un salon (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Salon supprimé

  /salons/{salonId}:
    get:
      tags: [Salons]
      summary: Voir les détails d’un salon
      security:
        - bearerAuth: []
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails du salon

  /salons/{salonId}/commentaire:
    post:
      tags: [Salons]
      summary: Laisser un commentaire
      security:
        - bearerAuth: []
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                commentaire:
                  type: string
      responses:
        '201':
          description: Commentaire ajouté

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT